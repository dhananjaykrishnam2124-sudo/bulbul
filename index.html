<style>

#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}

@keyframes fh{to{transform:translateY(-115vh) rotate(30deg);opacity:0}}

.bl::after{content:'';position:absolute;left:50%;top:calc(100% - 3px);margin-left:-6px;border:6px solid transparent;border-bottom:9px solid var(--c);border-top:0}

.roll{display:flex;gap:6vw;overflow-x:auto;scroll-snap-type:x mandatory;width:100vw;padding:18px 14vw 30px;scrollbar-width:none}.roll::-webkit-scrollbar{display:none}
figure{flex:0 0 auto;scroll-snap-align:center;transform:rotate(var(--r)) scale(var(--s,1));opacity:var(--o,1);transition:transform .15s linear}
.pol{position:relative;background:#fffaf2;padding:12px 12px 10px;border-radius:3px;box-shadow:0 18px 44px #0007;color:#6b4a45;transition:transform .5s cubic-bezier(.2,1.3,.4,1)}

.lt .fp{position:absolute;left:0;right:0;top:0;height:56%;background:linear-gradient(#f9d98c,#e0a550);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .7s;z-index:4;filter:drop-shadow(0 4px 4px #0003)}
.lt .sl{position:absolute;left:50%;top:44%;width:46px;height:46px;margin:-23px;border-radius:50%;z-index:5;background:radial-gradient(circle at 35% 30%,#ffd88a,#d58a2e);box-shadow:0 0 0 3px #ffe9b8aa,0 6px 14px #0005;display:grid;place-items:center;font:700 22px var(--serif);color:#fff;transition:.4s}
.lt.open .fp{transform:rotateX(180deg);z-index:1}.lt.open .sl{opacity:0}.lt.open .sh{transform:translateY(-62%)}

.prog{width:min(86vw,340px)}.tm{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;opacity:.8}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent}

<ellipse cx="80" cy="162" rx="56" ry="7" fill="#0006"/><rect x="26" y="80" width="108" height="78" rx="8" fill="url(#gb)"/><rect x="72" y="80" width="16" height="78" fill="url(#gr)"/>
<g id="lid"><rect x="18" y="58" width="124" height="28" rx="7" fill="#ff7fb0"/><rect x="72" y="58" width="16" height="28" fill="url(#gr)"/><path d="M80 58C58 24 30 36 44 54 50 62 72 58 80 58Z" fill="url(#gr)"/><path d="M80 58C102 24 130 36 116 54 110 62 88 58 80 58Z" fill="url(#gr)"/><circle cx="80" cy="58" r="8" fill="#f5c04a"/></g></svg><div class="glow"></div>

<script>
(()=>{'use strict';
/* ===== CONFIG (edit here) ===== */
const PIN_HASH='cbdd93926c2b89eba3312a7e10ac06089c8123872684f4f910f88a8ae7559556',SALT='anu-',BG_VOL=.6,SYNC=/[?&]sync/.test(location.search);
const REASONS=["You remember the little things I forget","The world is kinder with you in it","You make ordinary days feel special","You believed in me when I didn't","Your laugh is my favourite sound"];
const WORDS=["Smiles","Laughter","Joy","Love","Dreams","Magic"];
const LETTER=["Happy Birthday, my love.","Finally, a personal new year for you. I hope you achieve great things in the year ahead. Your journey might not be easy; it may be filled with problems and sorrows, but I wish you will keep moving forward without giving up. I know you have the potential. Just remember that if you ever need help, don't hesitate to come to me. I would love to be your greatest supporter. I wish that every second you live is beautiful. I love you, and I will always be with you."];
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)],sleep=ms=>new Promise(r=>setTimeout(r,ms));
const HT='<svg class="hr"><use href="#ht"/></svg>',ARROW='<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
const stage=$('#stage');let cur=$('#gate');
/* ===== AUDIO ENGINE: one context · one element per song · gain nodes · synthesized SFX with reverb ===== */
let AC,bg,pf,dry,wet,bgLevel=0,rT;
function audioInit(){if(AC){AC.resume();return}
AC=new(window.AudioContext||window.webkitAudioContext)();
const mk=(src,loop)=>{const a=new Audio(src);a.loop=loop;a.preload='auto';a.playsInline=true;const g=AC.createGain();g.gain.value=0;AC.createMediaElementSource(a).connect(g);g.connect(AC.destination);return{a,g}};
bg=mk('assets/audio/bg/blue.mp3',true);pf=mk('assets/audio/fav/perfect.mp3',false);
dry=AC.createGain();dry.gain.value=.85;dry.connect(AC.destination);
const cv=AC.createConvolver(),n=AC.sampleRate*2.4|0,ib=AC.createBuffer(2,n,AC.sampleRate);for(let c=0;c<2;c++){const d=ib.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.6)}cv.buffer=ib;wet=AC.createGain();wet.gain.value=.38;wet.connect(cv);cv.connect(AC.destination);
AC.resume()}
const fade=(g,v,t)=>{const n=AC.currentTime;g.gain.cancelScheduledValues(n);g.gain.setValueAtTime(g.gain.value,n);g.gain.linearRampToValueAtTime(v,n+t)};
function duck(ms){if(!bgLevel)return;fade(bg.g,bgLevel*.3,.1);clearTimeout(rT);rT=setTimeout(()=>{if(bgLevel)fade(bg.g,bgLevel,.7)},ms)}
const out=g=>{g.connect(dry);g.connect(wet)};
function noiseBuf(d){const b=AC.createBuffer(1,AC.sampleRate*d|0,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;return b}
function nz(t,dur,type,f,to,pk,at=.005){const s=AC.createBufferSource();s.buffer=noiseBuf(dur+.1);const fl=AC.createBiquadFilter();fl.type=type;fl.frequency.setValueAtTime(f,t);if(to)fl.frequency.exponentialRampToValueAtTime(to,t+dur);const g=AC.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(pk,t+at);g.gain.exponentialRampToValueAtTime(.0008,t+dur);s.connect(fl);fl.connect(g);out(g);s.start(t);s.stop(t+dur+.1)}
function osc(t,f,dur,type,pk,to,at=.006){const o=AC.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+dur);const g=AC.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(pk,t+at);g.gain.exponentialRampToValueAtTime(.0008,t+dur);o.connect(g);out(g);o.start(t);o.stop(t+dur+.05)}
function bell(t,f,dur=1.6,pk=.22){[[1,1],[2.76,.35],[5.4,.16],[8.9,.07]].forEach(([m,a],i)=>osc(t,f*m,dur/(1+i*.9),'sine',pk*a,0,.004))}
const N={C5:523.25,E5:659.25,G5:783.99,C6:1046.5,E6:1318.5,G6:1568,A5:880,D6:1174.7,B5:987.8};
function sfx(k){if(!AC)return;const t=AC.currentTime+.01;
switch(k){
case'tick':osc(t,1900,.05,'sine',.12);nz(t,.03,'highpass',4000,0,.05);break;
case'err':osc(t,247,.35,'triangle',.22,185);osc(t+.14,196,.45,'triangle',.22,150);duck(700);break;
case'unlock':[N.C5,N.E5,N.G5,N.C6,N.E6].forEach((f,i)=>bell(t+i*.09,f,1.8,.2));sparkle(t+.3,10);duck(1900);break;
case'whoosh':nz(t,.7,'bandpass',300,2600,.16,.25);break;
case'pop':nz(t,.04,'highpass',1500,0,.9,.001);nz(t,.18,'bandpass',900,200,.55,.002);osc(t,180,.14,'sine',.7,45,.002);duck(450);break;
case'burst':osc(t,90,.5,'sine',.8,38,.01);nz(t,.5,'bandpass',2400,500,.4,.01);[N.C5,N.G5,N.C6,N.E6,N.G6].forEach((f,i)=>bell(t+.05+i*.07,f,2,.2));sparkle(t+.2,16);duck(2200);break;
case'chime':[N.G5,N.C6,N.E6].forEach((f,i)=>bell(t+i*.13,f,1.6,.2));duck(1400);break;
case'env':nz(t,.18,'bandpass',2500,1200,.18,.02);nz(t+.12,.2,'bandpass',3200,1500,.12,.02);bell(t+.2,N.E6,1.2,.12);duck(800);break;
case'blow':nz(t,1,'bandpass',400,2200,.5,.25);duck(1300);break;
case'cheer':for(let i=0;i<26;i++)nz(t+Math.random()*1.6,.05+Math.random()*.05,'bandpass',1500+Math.random()*3000,0,.18,.001);nz(t,1.8,'bandpass',1600,900,.1,.4);[N.C5,N.E5,N.G5,N.C6].forEach((f,i)=>bell(t+i*.12,f,2,.18));duck(2300);break;
case'like':bell(t,N.E6,.9,.18);bell(t+.1,N.A5*2,1.2,.16);break;
}}
function sparkle(t,n){for(let i=0;i<n;i++)bell(t+i*.07+Math.random()*.04,1800+Math.random()*2600,.5,.05)}
/* ===== FX ===== */
const st=$('#stars');for(let i=0;i<55;i++){const e=document.createElement('i');e.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${2+Math.random()*4}s;animation-delay:-${Math.random()*4}s`;st.append(e)}
setInterval(()=>{if(document.hidden)return;const h=document.createElement('span');h.className='fh';h.innerHTML=HT;h.style.cssText=`left:${Math.random()*100}%;font-size:${10+Math.random()*16}px;color:${['#ff9ec6','#ffd9a0','#ffffff'][Math.random()*3|0]};animation-duration:${8+Math.random()*6}s`;$('#fx').append(h);setTimeout(()=>h.remove(),15000)},1200);
function confetti(x,y,n=36){const C=['#ff7eb6','#ffd166','#7dd3fc','#c4b5fd','#fff','#f3c56b'];for(let i=0;i<n;i++){const s=document.createElement('i');s.className='cf';s.style.cssText=`left:${x}px;top:${y}px;background:${C[i%6]}`;$('#fx').append(s);const a=Math.random()*6.28,v=70+Math.random()*190;s.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:`translate(${Math.cos(a)*v}px,${Math.sin(a)*v+170}px) rotate(${Math.random()*900}deg)`,opacity:0}],{duration:1200+Math.random()*800,easing:'cubic-bezier(.2,.7,.3,1)'}).onfinish=()=>s.remove()}}
const mid=()=>[innerWidth/2,innerHeight/2];
/* seamless transition: new scene fades in while the old one is still leaving */
function show(html,c1,c2,init){const old=cur;old.classList.add('out');setTimeout(()=>old.remove(),800);sfx('whoosh');
const r=document.documentElement.style,b=$('#bg');r.setProperty('--c1',c1);r.setProperty('--c2',c2);b.style.animation='none';void b.offsetWidth;b.style.animation='';
const s=document.createElement('section');s.className='s';s.innerHTML=html;stage.append(s);cur=s;init(s)}
/* ===== 1. PASSCODE (keypad; nothing else is in the DOM until the hash matches) ===== */
const gift=$('#gift'),msg=$('#msg'),slots=$$('.slot');let v='',lock=false;
$('.pad').innerHTML=[1,2,3,4,5,6,7,8,9,'',0,'del'].map(k=>k===''?'<span></span>':`<button class="glass" data-k="${k}">${k=='del'?'<svg viewBox="0 0 24 24"><path d="M21 5H9l-6 7 6 7h12z"/><path d="M13 9l4 6M17 9l-4 6"/></svg>':k}</button>`).join('');
const draw=()=>slots.forEach((s,i)=>{s.innerHTML=v[i]?HT:'';s.style.color=v[i]?'#ff7aa5':'';s.classList.toggle('on',i==v.length||(v.length==4&&i==3))});draw();
async function sha(s){if(!(window.crypto&&crypto.subtle))return s;const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function press(k){if(lock)return;audioInit();sfx('tick');msg.textContent='';if(k=='del')v=v.slice(0,-1);else if(v.length<4)v+=k;draw();if(v.length<4)return;lock=true;
if(await sha(SALT+v)===PIN_HASH){document.onkeydown=null;msg.textContent='Unlocked';sfx('unlock');gift.classList.add('open');await sleep(1500);SYNC?player():hold()}
else{sfx('err');gift.classList.remove('shake');void gift.offsetWidth;gift.classList.add('shake');msg.textContent="Oops, that's not our day. Try again";await sleep(650);v='';draw();lock=false}}
$$('.pad button').forEach(b=>b.onclick=()=>press(b.dataset.k));
document.onkeydown=e=>{if(/^\d$/.test(e.key))press(e.key);else if(e.key=='Backspace')press('del')};
/* ===== 2. HOLD & RELEASE ===== */
function hold(){show(`<p class=eyebrow>a little something, for you</p><div id=orb><svg class=ring viewBox="0 0 200 200"><circle cx=100 cy=100 r=90 fill=none stroke="#ffffff22" stroke-width=6 /><circle class=pg cx=100 cy=100 r=90 fill=none stroke-width=6 stroke-linecap=round stroke-dasharray=565.5 stroke-dashoffset=565.5 /></svg><svg class=hh><use href="#ht"/></svg></div><p id=hint class=sub>Press &amp; hold the heart</p>`,'#0b1640','#4a2a9a',s=>{
const o=$('#orb',s),hn=$('#hint',s),pg=$('.pg',s);let t0=0,raf=0,p=0,done=false;
const set=x=>{p=x;o.style.setProperty('--p',x);pg.style.strokeDashoffset=565.5*(1-x)};
const loop=()=>{set(Math.min(1,(performance.now()-t0)/1800));hn.textContent=p>=1?'Now let go':'Keep holding…';if(p<1)raf=requestAnimationFrame(loop)};
o.onpointerdown=e=>{if(done)return;e.preventDefault();audioInit();try{o.setPointerCapture(e.pointerId)}catch(_){}t0=performance.now();loop()};
const up=async()=>{if(done||!t0)return;cancelAnimationFrame(raf);if(p<1){t0=0;set(0);hn.textContent='A little longer… press & hold';return}
done=true;audioInit();bg.a.play().catch(()=>{});pf.a.play().then(()=>{pf.a.pause();pf.a.currentTime=0}).catch(()=>{});/* both silent (gain 0): unlocks playback on iOS */
sfx('burst');const[x,y]=mid();confetti(x,y,70);o.classList.add('burst');hn.textContent='';await sleep(1900);
bgLevel=BG_VOL;fade(bg.g,BG_VOL,2.5);reveal()};
o.onpointerup=up;o.onpointercancel=up;o.oncontextmenu=e=>e.preventDefault()})}
/* ===== 3. REVEAL ===== */
function reveal(){const W=(w,o)=>`<div class=hb>${[...w].map((c,i)=>`<span style="--i:${i+o}">${c}</span>`).join('')}</div>`;
show(`<div class=rays></div><p class=eyebrow style="animation:in 1s .1s both">it's officially your day</p>${W('Happy',0)}${W('Birthday',5)}<h2 class=name>Anu</h2><p class=sub style="animation:in 1s 2.4s both">And just like that, you're turning 19 ${HT}</p><button class="btn" id=nx style="animation:in 1s 3s both">Continue ${ARROW}</button>`,'#3b0f33','#c8467f',s=>{
setTimeout(()=>{sfx('chime');const[x,y]=mid();confetti(x,y*.8,60)},700);$('#nx',s).onclick=balloons})}
/* ===== 4. BALLOONS ===== */
function balloons(){const C=['#ff6b9d','#ffb347','#5fb8ff','#b794f6','#4fe0c2','#ff7a59'],P=[[4,6,66],[56,10,60],[28,34,78],[2,58,58],[58,52,70],[36,66,54]];
show(`<h2 class=title>Pop the balloons</h2><p class=sub>Six little surprises are floating around. Tap to pop them.</p><div class=field></div><p id=cnt class=eyebrow>0 / 6</p>`,'#0d2b57','#2b7fc2',s=>{
const f=$('.field',s);let n=0;
P.forEach(([x,y,w],i)=>{const b=document.createElement('div');b.className='bl';b.style.cssText=`--x:${x}%;--y:${y}%;--w:${w}px;--c:${C[i]};--d:${2.6+i*.45}s;--i:${i}`;b.innerHTML='<b></b><i></i>';f.append(b);
b.onpointerdown=()=>{if(b.dead)return;b.dead=1;audioInit();sfx('pop');const r=b.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;confetti(cx,cy,18+i*5);if(i==5)for(let k=0;k<5;k++)setTimeout(()=>confetti(cx+(Math.random()-.5)*160,cy+(Math.random()-.5)*120,16),k*110);
const w2=document.createElement('div');w2.className='wd';w2.textContent=WORDS[i];w2.style.cssText=`left:${cx}px;top:${cy}px`;$('#fx').append(w2);setTimeout(()=>w2.remove(),1600);
b.classList.add('pop');setTimeout(()=>b.remove(),200);n++;$('#cnt',s).textContent=n+' / 6';
if(n==6)setTimeout(()=>{const bt=Object.assign(document.createElement('button'),{className:'btn',innerHTML:'Next '+ARROW,onclick:reasons});$('#cnt',s).replaceWith(bt)},700)}})})}
/* ===== 5. FIVE ENVELOPES = FIVE REASONS ===== */
function reasons(){show(`<h2 class=title>Five little envelopes</h2><p class=sub>Each one holds a reason you're loved. Open them all.</p><div class=eg>${REASONS.map((r,i)=>`<div class=env5 style="--i:${i}"><div class=eb></div><div class=ef></div><div class=fp></div><div class=sl>${i+1}</div></div>`).join('')}</div><p id=cnt class=eyebrow>0 / 5 opened</p>`,'#2a1448','#7b3a8f',s=>{
let n=0;$$('.env5',s).forEach((e,i)=>e.onclick=()=>{audioInit();sfx('env');const first=!e.classList.contains('open');e.classList.add('open');
const c=document.createElement('div');c.className='card';c.innerHTML=`<div><small>REASON NO.${i+1}</small><p>${REASONS[i]}</p><span style="color:#d6336c;font-size:26px;display:block;margin-top:14px">${HT}</span><em>tap anywhere to close</em></div>`;document.body.append(c);const r=e.getBoundingClientRect();confetti(innerWidth/2,innerHeight/2,26);
c.onclick=()=>{c.remove();if(first){n++;$('#cnt',s).textContent=n+' / 5 opened';if(n==5)setTimeout(()=>{sfx('chime');const l=document.createElement('p');l.className='title';l.style.fontSize='24px';l.innerHTML=`…and a thousand more reasons ${HT}`;const bt=Object.assign(document.createElement('button'),{className:'btn',innerHTML:'Next '+ARROW,onclick:cake});$('#cnt',s).replaceWith(l,bt)},400)}}})})}
/* ===== 6. CHOCOLATE CAKE ===== */
function cake(){const xs=[104,134,166,196],cc=[['#ffd1e3','#ff9ec6'],['#d6ecff','#8fc8ff'],['#fff2bf','#ffd45e'],['#e3d4ff','#b79cff']];
const drips=Array.from({length:9},(_,i)=>`<rect x="${58+i*22}" y="96" width="13" height="${14+(i*7%5)*7}" rx="6.5" fill="url(#cf)"/>`).join('');
const chips=Array.from({length:7},(_,i)=>`<rect x="${70+i*26}" y="${84+(i*3%3)*3}" width="9" height="7" rx="1.5" fill="#6b3a1e" transform="rotate(${i*29%40-20} ${74+i*26} 88)"/>`).join('');
const sprk=Array.from({length:16},(_,i)=>`<rect x="${52+i*13}" y="${142+(i*5%3)*4}" width="5" height="2" rx="1" fill="${['#f5c04a','#fff3dc','#ff9ec6'][i%3]}" transform="rotate(${i*53%180} ${54+i*13} 144)"/>`).join('');
const cand=xs.map((x,i)=>`<rect x="${x-5}" y="54" width="10" height="36" rx="2.5" fill="url(#cd${i})"/><rect x="${x-.8}" y="48" width="1.6" height="8" fill="#333"/><g class="fw" data-i="${i}" transform="translate(${x} 50)"><circle cy="-16" r="22" fill="#fff" fill-opacity="0" pointer-events="all"/><g class="fl"><ellipse cy="-14" rx="15" ry="22" fill="#ffb02e" opacity=".22"/><path d="M0 0C-7-8-6-18 0-28 6-18 7-8 0 0Z" fill="#ffc542"/><path d="M0 0C-3-5-3-10 0-15 3-10 3-5 0 0Z" fill="#fff6c8"/></g></g>`).join('');
const defs=cc.map((c,i)=>`<linearGradient id="cd${i}" x1="0" x2="1"><stop offset="0" stop-color="${c[0]}"/><stop offset="1" stop-color="${c[1]}"/></linearGradient>`).join('');
show(`<h2 class=title>Make a wish, Anu</h2><div class=stage-cake><div class=halo></div><svg id=cake viewBox="0 0 300 245"><defs>${defs}<linearGradient id="c1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3c1b0e"/><stop offset=".5" stop-color="#5a2c17"/><stop offset="1" stop-color="#3a190c"/></linearGradient><linearGradient id="c2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4b2313"/><stop offset=".5" stop-color="#6e3820"/><stop offset="1" stop-color="#47200f"/></linearGradient><linearGradient id="cf" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#25100a"/><stop offset=".5" stop-color="#3d1d10"/><stop offset="1" stop-color="#25100a"/></linearGradient></defs><ellipse cx="150" cy="226" rx="142" ry="17" fill="#d9c7b5"/><ellipse cx="150" cy="220" rx="130" ry="12" fill="#fff7ee"/><rect x="40" y="150" width="220" height="72" rx="14" fill="url(#c1)"/><rect x="40" y="176" width="220" height="8" fill="#b57a45"/><rect x="62" y="102" width="176" height="56" rx="12" fill="url(#c2)"/><rect x="62" y="128" width="176" height="6" fill="#b57a45"/><rect x="54" y="88" width="192" height="24" rx="12" fill="url(#cf)"/>${drips}${chips}${sprk}<path d="M150 208c-10-8-18-13-18-20a8.5 8.5 0 0 1 18-3 8.5 8.5 0 0 1 18 3c0 7-8 12-18 20z" fill="#f5c04a" opacity=".95" transform="translate(0 -2) scale(1)"/>${cand}</svg></div><p id=cm class=sub>Blow out the candles. Use the button, tap the flames, or blow into your phone.</p><div class=row><button class=btn id=bl>Blow the candles</button><button class="btn ghost" id=mc>Use mic</button></div>`,'#25110a','#6b3a22',s=>{
const svg=$('#cake',s),cm=$('#cm',s);let n=0,blown=false,stream;
const snuff=i=>{const w=$(`.fw[data-i="${i}"]`,s);if(w.dataset.o)return;w.dataset.o=1;w.classList.add('off');for(let k=0;k<3;k++){const c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('cx',xs[i]+k*3-3);c.setAttribute('cy',46);c.setAttribute('r',5);c.setAttribute('fill','#ddd');c.setAttribute('class','sm');c.style.animationDelay=k*.2+'s';svg.append(c);setTimeout(()=>c.remove(),2300)}if(++n==4)win()};

$$('.fw',s).forEach(w=>w.onpointerdown=()=>{audioInit();sfx('blow');snuff(+w.dataset.i)});
$('#bl',s).onclick=()=>{audioInit();blowAll()};
$('#mc',s).onclick=async()=>{try{audioInit();stream=await navigator.mediaDevices.getUserMedia({audio:true});const an=AC.createAnalyser();an.fftSize=512;AC.createMediaStreamSource(stream).connect(an);const d=new Uint8Array(an.fftSize);let hot=0;cm.textContent='Go on… blow!';const tick=()=>{if(n==4)return;an.getByteTimeDomainData(d);let q=0;for(const x of d)q+=(x-128)**2;hot=Math.sqrt(q/d.length)/128>.2?hot+1:Math.max(0,hot-1);if(hot>12)blowAll();requestAnimationFrame(tick)};tick()}catch(e){cm.textContent='Mic not available. Use the Blow button.'}};
async function win(){stream&&stream.getTracks().forEach(t=>t.stop());$('.halo',s).classList.add('off');await sleep(600);sfx('cheer');[.2,.5,.8].forEach((k,i)=>setTimeout(()=>confetti(innerWidth*k,innerHeight*.35,50),i*250));
cm.innerHTML=`Your wish is on its way ${HT}`;$('.row',s).innerHTML=`<button class=btn id=nx>Our memories ${ARROW}</button>`;$('#nx',s).onclick=photos}})}
/* ===== 7. PHOTOS ===== */
function photos(){const R=[-2.5,2,-1.5,2.5,-2];
show(`<h2 class=title>Our little memories</h2><p class=sub>Swipe through. Tap a photo to lift it.</p><div class=roll>${R.map((r,i)=>`<figure style="--r:${r}deg"><div class=pol><img src="assets/photos/photo${i+1}.jpg" alt="Memory ${i+1}"><figcaption>Memory ${i+1}</figcaption></div></figure>`).join('')}</div><div class=dots>${R.map(()=>'<i></i>').join('')}</div><button class="btn hid" id=nx>There's a letter for you ${ARROW}</button>`,'#3a1f2e','#a5586a',s=>{
const rl=$('.roll',s),fg=$$('figure',s),dt=$$('.dots i',s);fg.forEach(f=>f.onclick=()=>{f.classList.toggle('lift');const r=f.getBoundingClientRect();confetti(r.left+r.width/2,r.top+r.height/2,12);sfx('like')});
const upd=()=>{const c=rl.scrollLeft+rl.clientWidth/2;let best=0,bd=1e9;fg.forEach((f,i)=>{const d=Math.abs(c-(f.offsetLeft+f.offsetWidth/2));if(d<bd){bd=d;best=i}const k=Math.min(1,d/(rl.clientWidth*.6));f.style.setProperty('--s',1-.14*k);f.style.setProperty('--o',1-.5*k)});dt.forEach((d,i)=>d.classList.toggle('on',i==best));if(best==4)$('#nx',s).classList.remove('hid')};
rl.onscroll=()=>requestAnimationFrame(upd);setTimeout(upd,50);$('#nx',s).onclick=letter})}
/* ===== 8. LETTER (same sequence as the reference: tap → flap opens → paper rises with sparkles → card unfolds → words write in) ===== */
function letter(){show(`<p class=title style="font-size:26px">One last thing, Anu…</p><p class=sub>I wrote you a letter.</p><div class=lt id=lt><div class=eb></div><div class=sh></div><div class=ef></div><div class=fp></div><div class=sl>A</div></div><div class=tapme id=tp><svg width=22 height=22 viewBox="0 0 24 24" fill=none stroke=#fff stroke-width=2 stroke-linecap=round stroke-linejoin=round><path d="M9 11V5a2 2 0 0 1 4 0v6M13 10a2 2 0 0 1 4 0v2a6 6 0 0 1-6 6h-1a6 6 0 0 1-5-3l-2-4a2 2 0 0 1 3-2l1 1"/></svg>Tap to open your letter</div>`,'#2d1a3d','#8d4f6e',s=>{
const lt=$('#lt',s);let busy=false;lt.onclick=async()=>{if(busy)return;busy=true;audioInit();$('#tp',s).style.opacity=0;lt.classList.add('open');sfx('env');
['🎂','🎈','✨','💛','🎈','🎉'].forEach((e,i)=>setTimeout(()=>{const p=document.createElement('span');p.className='spr';p.textContent=e;p.style.cssText=`left:${25+i*10}%;top:30%;--dx:${(i%2?1:-1)*(20+i*8)}px;--dy:-${60+i*14}px;--r:${(i%2?1:-1)*30}deg`;lt.append(p);setTimeout(()=>p.remove(),1700)},500+i*140));
await sleep(1900);lt.classList.add('gone');$('#tp',s).remove();[...s.children].forEach(c=>{c.style.transition='opacity .45s';c.style.opacity=0});await sleep(500);
[...s.children].forEach(c=>c.remove());
const ps=document.createElement('div');ps.className='paper';let k=0;ps.innerHTML=LETTER.map(t=>`<p>${t.split(/( )/).map(w=>w==' '?' ':`<span class=w style="animation-delay:${(.5+k++*.085).toFixed(2)}s">${w}</span>`).join('')}</p>`).join('');
const gw=document.createElement('div');gw.className='gw';ps.append(gw);s.append(ps);s.scrollTop=0;
/* the whole screen scrolls, so the paper and its text move together; the view follows the writing until she scrolls herself */
let user=false;['touchstart','wheel'].forEach(ev=>s.addEventListener(ev,()=>user=true,{once:true,passive:true}));
const ws=$$('.w',ps),t0=performance.now(),iv=setInterval(()=>{if(user)return;const i=Math.floor(((performance.now()-t0)/1000-.5)/.085);if(i<0)return;if(i>ws.length+3){clearInterval(iv);return}const r=ws[Math.min(i,ws.length-1)].getBoundingClientRect(),lim=innerHeight-120;if(r.bottom>lim)s.scrollBy({top:r.bottom-lim+50,behavior:'smooth'})},180);
const total=(.5+k*.085+.6)*1000;let shown=false;const done=()=>{if(shown)return;shown=true;clearInterval(iv);const g=document.createElement('button');g.className='go';g.setAttribute('aria-label','continue');g.innerHTML=ARROW;g.onclick=e=>{e.stopPropagation();finale()};gw.append(g);if(!user)setTimeout(()=>g.scrollIntoView({behavior:'smooth',block:'center'}),100)};
setTimeout(done,total);ps.onclick=()=>{$$('.w',ps).forEach(w=>{w.style.animation='wi .2s forwards';w.style.animationDelay='0s'});setTimeout(done,350)}}})}
/* ===== 9. FINALE ===== */
function finale(){show(`<div class=rays></div><svg class=bigheart viewBox="0 0 24 24"><use href="#ht"/></svg><h1 class=fin>Happy Birthday,<br>Anu</h1><p class=sub style="animation:in 1s 1.2s both">Dhananjay made this little world just for you.<br>Tap anywhere for sparkles.</p><button class="btn hid" id=nx>One more thing ${ARROW}</button>`,'#3a0d3a','#e0568a',s=>{
sfx('cheer');[.2,.5,.8].forEach((k,i)=>setTimeout(()=>confetti(innerWidth*k,innerHeight*.4,55),i*300));
s.onpointerdown=e=>{if(!e.target.closest('button')){confetti(e.clientX,e.clientY,24);sfx('like')}};setTimeout(()=>$('#nx',s).classList.remove('hid'),3000);$('#nx',s).onclick=player})}
/* ===== 10. PERFECT PLAYER ===== */
function player(){audioInit();const IC={play:'<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',pause:'<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>'};
show(`<p class=eyebrow>Enjoy Your Favourite Song ${HT}</p><div class=deck id=deck><div class=art><div class=cg></div><span class=bk style="width:46px;height:46px;left:14%;top:18%"></span><span class=bk style="width:26px;height:26px;right:16%;top:30%;animation-delay:-2s"></span><span class=bk style="width:60px;height:60px;right:12%;bottom:12%;animation-delay:-1s"></span><svg class=hh><use href="#ht"/></svg></div><div class=lyr id=lyr></div></div><div class=meta><div><h3>Perfect</h3><p>Ed Sheeran</p></div><div class=cl><button class=ib id=like aria-label="like"><svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54z"/></svg></button><button class=ib id=lb><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h10M4 17h14"/></svg>Lyrics</button></div></div><div class=prog><input type=range id=seek min=0 max=1000 value=0 aria-label=seek><div class=tm><span id=tc>0:00</span><span id=td>0:00</span></div></div><button class=play id=pp aria-label=play>${IC.play}</button><button class=tapov id=tap hidden>Tap to play ${HT}</button><button class="btn ghost hid" id=mark>Tap at the start of each line</button>`,'#041428','#0f5fb0',s=>{
const a=pf.a,dk=$('#deck',s),ly=$('#lyr',s),sk=$('#seek',s),tc=$('#tc',s),td=$('#td',s),pp=$('#pp',s),tap=$('#tap',s);let L=[],act=-1,timed=false,started=false;
const fmt=t=>isFinite(t)?Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0'):'0:00';
const upd=()=>{const d=a.duration||0;if(!sk.d)sk.value=d?a.currentTime/d*1000:0;sk.style.setProperty('--v',sk.value/10+'%');tc.textContent=fmt(a.currentTime);td.textContent=fmt(d);pp.innerHTML=a.paused?IC.play:IC.pause};
a.ontimeupdate=a.onloadedmetadata=a.onpause=upd;a.onplay=()=>{fade(pf.g,1,1.2);upd()};
sk.oninput=()=>{sk.d=1;tc.textContent=fmt(sk.value/1000*a.duration);sk.style.setProperty('--v',sk.value/10+'%')};sk.onchange=()=>{a.currentTime=sk.value/1000*(a.duration||0);sk.d=0};
pp.onclick=()=>{audioInit();a.paused?a.play():a.pause()};tap.onclick=()=>{audioInit();a.play();tap.hidden=true};
$('#like',s).onclick=e=>{const l=e.currentTarget;l.classList.toggle('on');if(l.classList.contains('on')){const r=l.getBoundingClientRect();confetti(r.left+23,r.top+23,16);sfx('like')}};
$('#lb',s).onclick=e=>{dk.classList.toggle('lo');e.currentTarget.classList.toggle('on')};
/* lyrics: assets/lyrics/perfect.lrc, lines like [01:23.45]text. Untimed lines are shown but never highlighted. */
const render=()=>{ly.innerHTML=L.length?L.map(o=>`<p>${o.x}</p>`).join(''):'<p class=note>Add the lyrics in assets/lyrics/perfect.lrc (see README)</p>';timed=L.length>0&&L.every(o=>o.t!=null);if(L.length&&!timed&&!SYNC)ly.insertAdjacentHTML('afterbegin','<p class=note>(lyrics not timed yet)</p>')};
const parse=txt=>txt.split(/\r?\n/).map(l=>l.trim()).filter(l=>l&&l[0]!='#').map(l=>{const m=l.match(/^\[(\d+):(\d+(?:\.\d+)?)\]\s*(.*)$/);return m?{t:+m[1]*60+ +m[2],x:m[3]}:{t:null,x:l}}).filter(o=>o.x);
if(SYNC)syncTool();else fetch('assets/lyrics/perfect.lrc').then(r=>r.ok?r.text():'').catch(()=>'').then(t=>{L=parse(t);render()});
const loop=()=>{if(timed&&!a.paused){const c=a.currentTime+.15;let i=-1;for(let k=0;k<L.length;k++)if(L[k].t<=c)i=k;if(i!=act){act=i;const ps=$$('p:not(.note)',ly);ps.forEach((p,k)=>p.classList.toggle('on',k==i));if(ps[i])ly.scrollTo({top:ps[i].offsetTop-ly.clientHeight/2+ps[i].clientHeight/2,behavior:'smooth'})}}requestAnimationFrame(loop)};loop();
function syncTool(){const o=document.createElement('div');o.className='sp';o.innerHTML='<p class=title style="font-size:26px">Lyrics sync tool</p><p class=sub>Paste the lyrics, one line per row, then start. Tap the button at the start of every line while the song plays.</p><textarea placeholder="Paste lyrics here"></textarea><button class=btn>Start</button>';document.body.append(o);
$('.btn',o).onclick=()=>{L=$('textarea',o).value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).map(x=>({t:null,x}));if(!L.length)return;o.remove();render();dk.classList.add('lo');const mk=$('#mark',s);mk.classList.remove('hid');const T=[];let i=0;const ps=$$('p',ly);a.currentTime=0;audioInit();a.play().catch(()=>{});
mk.onclick=()=>{if(i>=L.length)return;T[i]=a.currentTime;ps[i].classList.add('on');ps[i].scrollIntoView({behavior:'smooth',block:'center'});i++;if(i==L.length){const t=L.map((l,k)=>`[${String(Math.floor(T[k]/60)).padStart(2,'0')}:${(T[k]%60).toFixed(2).padStart(5,'0')}]${l.x}`).join('\n');const ta=Object.assign(document.createElement('textarea'),{value:t,style:'height:90px'});mk.replaceWith(ta);ta.select()}}}}
/* Blue keeps its own level for the whole journey and fades out ONLY now; Perfect starts 0.75s after this scene is visible */
if(bgLevel){bgLevel=0;fade(bg.g,0,3);setTimeout(()=>bg.a.pause(),3200)}
setTimeout(async()=>{if(started)return;started=true;try{await a.play()}catch(e){tap.hidden=false}},750)})}
})();
</script></body></html>
